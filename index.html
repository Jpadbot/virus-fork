<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微生物下落（暫名）</title>
<style>
  :root {
    --bg: #161a17;
    --panel: #1e2420;
    --ink: #e6e2d6;
    --muted: #9a9588;
    --line: #3a4038;
    --bact: #c9a227;
    --vir: #6a8fa8;
    --gate: #2a322c;
    --gate-hi: #3d4a40;
    --warn: #c47a5a;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.4; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app {
    width: 100%; max-width: 440px; height: 100%; height: 100dvh;
    margin: 0 auto; display: flex; flex-direction: column;
    position: relative;
  }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }

  /* Title */
  #title {
    padding: 28px 20px calc(24px + var(--safe-bottom));
    justify-content: center; gap: 18px; text-align: center;
  }
  #title h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: 0.04em; }
  #title p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .title-mascot { width: 120px; height: 120px; margin: 8px auto; }
  .btn {
    display: block; width: 100%; max-width: 320px; margin: 0 auto;
    min-height: 48px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink);
    font-size: 1.05rem; font-weight: 600; font-family: inherit;
    cursor: pointer;
  }
  .btn:active { background: var(--gate-hi); }
  .btn-main { background: #2c3830; border-color: #4a5c50; }
  .hint-list { text-align: left; color: var(--muted); font-size: 0.85rem; max-width: 320px; margin: 0 auto; padding-left: 1.1em; }
  .hint-list li { margin: 4px 0; }

  /* Play */
  #play { position: relative; background: var(--bg); }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 10px 12px 8px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(22,26,23,0.92) 0%, rgba(22,26,23,0) 100%);
  }
  #hud .name { font-size: 1rem; font-weight: 700; margin: 0; }
  #hud .latin { font-size: 0.78rem; color: var(--muted); font-style: italic; margin: 2px 0 0; }
  #hud .blurb { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }
  #stage {
    flex: 1; position: relative; overflow: hidden; touch-action: none;
    cursor: pointer;
  }
  .lane-hint {
    position: absolute; inset: 0; display: flex; pointer-events: none; opacity: 0.08;
  }
  .lane-hint span { flex: 1; border-right: 1px dashed #fff; }
  .lane-hint span:last-child { border-right: none; }

  #creature {
    position: absolute; width: 72px; height: 72px;
    margin-left: -36px; margin-top: -36px;
    z-index: 3; will-change: left, top;
    transition: filter 0.2s;
  }
  #creature.flash { filter: brightness(1.4); }

  .gate-row {
    position: absolute; left: 0; right: 0; height: 88px;
    display: flex; gap: 8px; padding: 0 10px;
    z-index: 2; will-change: top;
  }
  .gate {
    flex: 1; min-width: 0;
    border: 2px solid var(--line);
    border-radius: 8px;
    background: var(--gate);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6px 4px; text-align: center;
  }
  .gate.hi { border-color: var(--bact); background: var(--gate-hi); }
  .gate.vir-hi { border-color: var(--vir); background: var(--gate-hi); }
  .gate .g-title { font-size: 0.82rem; font-weight: 700; line-height: 1.2; }
  .gate .g-sub { font-size: 0.68rem; color: var(--muted); margin-top: 3px; line-height: 1.15; }

  #toast {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    z-index: 6; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 14px;
    font-size: 0.9rem; text-align: center; max-width: 86%;
    opacity: 0; transition: opacity 0.2s;
  }
  #toast.show { opacity: 1; }

  #controls-hint {
    position: absolute; bottom: calc(10px + var(--safe-bottom)); left: 0; right: 0;
    text-align: center; color: var(--muted); font-size: 0.75rem;
    z-index: 4; pointer-events: none;
  }

  /* End */
  #end {
    padding: 24px 18px calc(24px + var(--safe-bottom));
    justify-content: center; gap: 14px; text-align: center; overflow-y: auto;
  }
  #end h2 { margin: 0; font-size: 1.35rem; line-height: 1.35; }
  #end .latin { color: var(--muted); font-style: italic; font-size: 0.9rem; margin: 0; }
  #end .end-mascot { width: 140px; height: 140px; margin: 4px auto; }
  #end .story { color: var(--muted); font-size: 0.9rem; margin: 0; text-align: left; }
  #end .path { font-size: 0.8rem; color: var(--muted); text-align: left;
    border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
  #end .path ol { margin: 6px 0 0; padding-left: 1.2em; }
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen active" aria-label="開局">
    <div class="title-mascot" id="titleMascot"></div>
    <h1>微生物下落</h1>
    <p>暫名原型・休閒探索・非正式品名</p>
    <ul class="hint-list">
      <li>公仔會不斷往下掉</li>
      <li>左右鍵、左右滑、或點左／右半邊，對準門槽</li>
      <li>不同選擇會走到不同終局（真分叉）</li>
    </ul>
    <button type="button" class="btn btn-main" id="btnStart">開始下落</button>
  </section>

  <section id="play" class="screen" aria-label="遊戲">
    <div id="hud">
      <p class="name" id="hudName">原始微粒</p>
      <p class="latin" id="hudLatin">Proto-microbe（簡化／假設）</p>
      <p class="blurb" id="hudBlurb">簡化科普／假設：尚未分化成細菌或病毒。</p>
    </div>
    <div id="stage">
      <div class="lane-hint" aria-hidden="true"><span></span><span></span><span></span></div>
      <div id="creature" aria-hidden="true"></div>
      <div id="toast" role="status"></div>
      <div id="controls-hint">← 左半／右半 點或滑 →　鍵盤 ← →</div>
    </div>
  </section>

  <section id="end" class="screen" aria-label="終局">
    <div class="end-mascot" id="endMascot"></div>
    <h2 id="endTitle">你已成為……</h2>
    <p class="latin" id="endLatin"></p>
    <p class="story" id="endStory"></p>
    <div class="path">
      <strong>本局路徑</strong>
      <ol id="endPath"></ol>
    </div>
    <button type="button" class="btn btn-main" id="btnAgain">再玩一次</button>
  </section>
</div>

<script>
(function () {
  "use strict";

  /* —— 形態 SVG（原創簡筆） —— */
  function svg(inner, vb) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (vb || "0 0 64 64") +
      '" width="100%" height="100%" aria-hidden="true">' + inner + "</svg>";
  }
  const FORMS = {
    seed: {
      id: "seed", name: "原始微粒", latin: "Proto-microbe（簡化／假設）",
      blurb: "簡化科普／假設：共同起點，尚未分化成細菌或病毒。",
      draw: function () {
        return svg(
          '<circle cx="32" cy="32" r="14" fill="#8a8680" stroke="#cfcac0" stroke-width="2"/>' +
          '<circle cx="28" cy="28" r="3" fill="#cfcac0" opacity="0.5"/>'
        );
      }
    },
    bact_wall: {
      id: "bact_wall", name: "原核雛形", latin: "Prokaryotic draft（簡化／假設）",
      blurb: "簡化科普／假設：出現細胞壁與獨立代謝方向，偏細菌。",
      draw: function () {
        return svg(
          '<ellipse cx="32" cy="34" rx="18" ry="14" fill="#a88820" stroke="#e8c84a" stroke-width="2.5"/>' +
          '<ellipse cx="32" cy="34" rx="10" ry="7" fill="#6a5810" opacity="0.55"/>' +
          '<circle cx="26" cy="30" r="2.5" fill="#f0e6a8"/>'
        );
      }
    },
    bact_cocci: {
      id: "bact_cocci", name: "球菌團", latin: "Coccus cluster（簡化／假設）",
      blurb: "簡化科普／假設：球形細胞聚集，朝葡萄球菌屬方向。",
      draw: function () {
        return svg(
          '<circle cx="24" cy="28" r="10" fill="#b89220" stroke="#e8c84a" stroke-width="2"/>' +
          '<circle cx="40" cy="28" r="10" fill="#c9a227" stroke="#e8c84a" stroke-width="2"/>' +
          '<circle cx="32" cy="42" r="10" fill="#a88820" stroke="#e8c84a" stroke-width="2"/>'
        );
      }
    },
    bact_pigment: {
      id: "bact_pigment", name: "金黃前體", latin: "Golden cocci（簡化／假設）",
      blurb: "簡化科普／假設：出現金黃色素傾向；真實菌種特徵遠更複雜。",
      draw: function () {
        return svg(
          '<circle cx="22" cy="26" r="11" fill="#d4a820" stroke="#ffe08a" stroke-width="2"/>' +
          '<circle cx="40" cy="24" r="11" fill="#e0b428" stroke="#ffe08a" stroke-width="2"/>' +
          '<circle cx="30" cy="40" r="12" fill="#c99618" stroke="#ffe08a" stroke-width="2"/>' +
          '<circle cx="44" cy="40" r="9" fill="#d4a820" stroke="#ffe08a" stroke-width="2"/>'
        );
      }
    },
    aureus: {
      id: "aureus", name: "金黃葡萄球菌", latin: "Staphylococcus aureus",
      blurb: "簡化科普／假設：常見於皮膚／鼻腔的球菌；此為遊戲簡化形態。",
      draw: function () {
        return svg(
          '<circle cx="20" cy="24" r="11" fill="#e8b020" stroke="#fff0a8" stroke-width="2"/>' +
          '<circle cx="38" cy="22" r="12" fill="#f0c040" stroke="#fff0a8" stroke-width="2"/>' +
          '<circle cx="28" cy="38" r="12" fill="#d4a018" stroke="#fff0a8" stroke-width="2"/>' +
          '<circle cx="46" cy="38" r="10" fill="#e8b020" stroke="#fff0a8" stroke-width="2"/>' +
          '<circle cx="34" cy="28" r="3" fill="#fff8d0" opacity="0.7"/>'
        );
      }
    },
    vir_capsid: {
      id: "vir_capsid", name: "病毒雛形", latin: "Capsid draft（簡化／假設）",
      blurb: "簡化科普／假設：核酸外包蛋白殼，需宿主才能複製。",
      draw: function () {
        return svg(
          '<polygon points="32,12 50,22 50,42 32,52 14,42 14,22" fill="#4a6a80" stroke="#9ec0d8" stroke-width="2"/>' +
          '<circle cx="32" cy="32" r="7" fill="#2a4050"/>'
        );
      }
    },
    vir_rna: {
      id: "vir_rna", name: "RNA 粒子", latin: "RNA virion draft（簡化／假設）",
      blurb: "簡化科普／假設：偏向 RNA 基因組；真實分類遠更細。",
      draw: function () {
        return svg(
          '<ellipse cx="32" cy="34" rx="16" ry="12" fill="#5a7a90" stroke="#a8d0e8" stroke-width="2"/>' +
          '<path d="M20 34 Q26 26 32 34 Q38 42 44 34" fill="none" stroke="#c8e8f8" stroke-width="2"/>' +
          '<circle cx="18" cy="22" r="3" fill="#8ab0c8"/><circle cx="46" cy="22" r="3" fill="#8ab0c8"/>' +
          '<circle cx="32" cy="16" r="3" fill="#8ab0c8"/>'
        );
      }
    },
    vir_spike: {
      id: "vir_spike", name: "突刺粒子", latin: "Spiked envelope（簡化／假設）",
      blurb: "簡化科普／假設：表面突刺利於附著細胞；流感病毒亦有類似結構（簡化）。",
      draw: function () {
        return svg(
          '<ellipse cx="32" cy="36" rx="15" ry="11" fill="#6a8fa8" stroke="#b8d8f0" stroke-width="2"/>' +
          '<line x1="32" y1="12" x2="32" y2="25" stroke="#c8e0f0" stroke-width="2"/>' +
          '<circle cx="32" cy="11" r="4" fill="#d0e8f8"/>' +
          '<line x1="16" y1="20" x2="22" y2="28" stroke="#c8e0f0" stroke-width="2"/>' +
          '<circle cx="15" cy="18" r="3.5" fill="#d0e8f8"/>' +
          '<line x1="48" y1="20" x2="42" y2="28" stroke="#c8e0f0" stroke-width="2"/>' +
          '<circle cx="49" cy="18" r="3.5" fill="#d0e8f8"/>' +
          '<line x1="12" y1="40" x2="20" y2="38" stroke="#c8e0f0" stroke-width="2"/>' +
          '<circle cx="10" cy="40" r="3" fill="#d0e8f8"/>' +
          '<line x1="52" y1="40" x2="44" y2="38" stroke="#c8e0f0" stroke-width="2"/>' +
          '<circle cx="54" cy="40" r="3" fill="#d0e8f8"/>'
        );
      }
    },
    influenza: {
      id: "influenza", name: "流感病毒", latin: "Influenza virus",
      blurb: "簡化科普／假設：常見呼吸道病毒；此為遊戲簡化形態，非臨床診斷依據。",
      draw: function () {
        return svg(
          '<ellipse cx="32" cy="36" rx="16" ry="12" fill="#7aa0b8" stroke="#d0ecff" stroke-width="2.5"/>' +
          '<ellipse cx="32" cy="36" rx="8" ry="6" fill="#3a5568"/>' +
          '<line x1="32" y1="8" x2="32" y2="24" stroke="#e0f0ff" stroke-width="2.5"/>' +
          '<circle cx="32" cy="7" r="5" fill="#f0f8ff"/>' +
          '<line x1="12" y1="18" x2="20" y2="28" stroke="#e0f0ff" stroke-width="2.5"/>' +
          '<circle cx="10" cy="16" r="4.5" fill="#f0f8ff"/>' +
          '<line x1="52" y1="18" x2="44" y2="28" stroke="#e0f0ff" stroke-width="2.5"/>' +
          '<circle cx="54" cy="16" r="4.5" fill="#f0f8ff"/>' +
          '<line x1="8" y1="42" x2="18" y2="40" stroke="#e0f0ff" stroke-width="2"/>' +
          '<circle cx="6" cy="42" r="3.5" fill="#f0f8ff"/>' +
          '<line x1="56" y1="42" x2="46" y2="40" stroke="#e0f0ff" stroke-width="2"/>' +
          '<circle cx="58" cy="42" r="3.5" fill="#f0f8ff"/>'
        );
      }
    }
  };

  /* —— 真分叉關卡（背後樹；畫面不畫樹） ——
     每一關 options[].next 指向下一形態；終局 next 為 null 且 endKind 標示。
     細菌線與病毒線從第一關即分叉，終點不同。 */
  const LEVELS = {
    seed: {
      form: "seed",
      prompt: "你要往哪種結構長？",
      options: [
        { title: "築起細胞壁", sub: "獨立代謝・細菌向", next: "bact_wall", tint: "bact" },
        { title: "包進蛋白殼", sub: "寄生複製・病毒向", next: "vir_capsid", tint: "vir" },
        { title: "再觀望一下", sub: "仍停留未分化", next: "seed_loop", tint: "" }
      ]
    },
    seed_loop: {
      form: "seed",
      prompt: "不能再拖了——選一邊",
      options: [
        { title: "築起細胞壁", sub: "細菌向", next: "bact_wall", tint: "bact" },
        { title: "包進蛋白殼", sub: "病毒向", next: "vir_capsid", tint: "vir" }
      ]
    },
    bact_wall: {
      form: "bact_wall",
      prompt: "細胞形態？",
      options: [
        { title: "聚成球菌串", sub: "朝葡萄球菌屬", next: "bact_cocci", tint: "bact" },
        { title: "拉成細桿", sub: "偏桿菌（仍細菌向）", next: "bact_cocci_via_rod", tint: "bact" }
      ]
    },
    bact_cocci_via_rod: {
      form: "bact_cocci",
      prompt: "環境壓力下又縮回球菌團",
      options: [
        { title: "維持球菌團", sub: "繼續細菌線", next: "bact_cocci", tint: "bact" }
      ]
    },
    bact_cocci: {
      form: "bact_cocci",
      prompt: "色素與酶？",
      options: [
        { title: "金黃色素", sub: "朝金黃葡萄球菌", next: "bact_pigment", tint: "bact" },
        { title: "偏白菌落", sub: "仍可轉金黃（簡化）", next: "bact_pigment", tint: "bact" },
        { title: "加強表面黏附", sub: "形態接近金黃前體", next: "bact_pigment", tint: "bact" }
      ]
    },
    bact_pigment: {
      form: "bact_pigment",
      prompt: "定植何處？",
      options: [
        { title: "人體鼻腔／皮膚", sub: "成為金黃葡萄球菌", next: "aureus", tint: "bact" },
        { title: "傷口周圍", sub: "同樣收束金黃葡萄球菌", next: "aureus", tint: "bact" }
      ]
    },
    aureus: {
      form: "aureus", end: true,
      endKind: "bact",
      endTitle: "你已成為「金黃葡萄球菌」細菌",
      endStory: "本局走細菌向真分叉終局。金黃葡萄球菌（Staphylococcus aureus）在此僅作休閒探索命名；非醫療建議。"
    },
    vir_capsid: {
      form: "vir_capsid",
      prompt: "基因組傾向？",
      options: [
        { title: "RNA 單股", sub: "朝流感樣", next: "vir_rna", tint: "vir" },
        { title: "碎成多節段 RNA", sub: "亦朝流感樣（簡化）", next: "vir_rna", tint: "vir" }
      ]
    },
    vir_rna: {
      form: "vir_rna",
      prompt: "表面構造？",
      options: [
        { title: "長出突刺蛋白", sub: "朝流感病毒", next: "vir_spike", tint: "vir" },
        { title: "加一層脂膜", sub: "之後仍長突刺", next: "vir_spike", tint: "vir" },
        { title: "強化殼體對稱", sub: "再進化出突刺", next: "vir_spike", tint: "vir" }
      ]
    },
    vir_spike: {
      form: "vir_spike",
      prompt: "複製場域？",
      options: [
        { title: "呼吸道上皮", sub: "成為流感病毒", next: "influenza", tint: "vir" },
        { title: "飛沫傳播循環", sub: "同樣收束流感病毒", next: "influenza", tint: "vir" }
      ]
    },
    influenza: {
      form: "influenza", end: true,
      endKind: "vir",
      endTitle: "你已成為「流感病毒」病毒",
      endStory: "本局走病毒向真分叉終局。流感病毒（Influenza virus）在此僅作休閒探索命名；非醫療建議。"
    }
  };

  /* 證明非假分叉：從 seed 選細胞壁永不達 influenza；選蛋白殼永不達 aureus */
  const PROOF = {
    bactExclusiveEnd: "aureus",
    virExclusiveEnd: "influenza",
    note: "第一關「築起細胞壁」鎖細菌線→金黃葡萄球菌；「包進蛋白殼」鎖病毒線→流感病毒。兩線無匯合節點。"
  };

  const el = {
    title: document.getElementById("title"),
    play: document.getElementById("play"),
    end: document.getElementById("end"),
    stage: document.getElementById("stage"),
    creature: document.getElementById("creature"),
    toast: document.getElementById("toast"),
    hudName: document.getElementById("hudName"),
    hudLatin: document.getElementById("hudLatin"),
    hudBlurb: document.getElementById("hudBlurb"),
    titleMascot: document.getElementById("titleMascot"),
    endMascot: document.getElementById("endMascot"),
    endTitle: document.getElementById("endTitle"),
    endLatin: document.getElementById("endLatin"),
    endStory: document.getElementById("endStory"),
    endPath: document.getElementById("endPath")
  };

  el.titleMascot.innerHTML = FORMS.seed.draw();

  let state = null;
  let raf = 0;
  let lastTs = 0;
  let keys = { left: false, right: false };
  let gateRowEl = null;

  function showScreen(name) {
    el.title.classList.toggle("active", name === "title");
    el.play.classList.toggle("active", name === "play");
    el.end.classList.toggle("active", name === "end");
  }

  function setForm(formId) {
    const f = FORMS[formId];
    el.creature.innerHTML = f.draw();
    el.hudName.textContent = f.name;
    el.hudLatin.textContent = f.latin;
    el.hudBlurb.textContent = f.blurb;
    el.creature.classList.add("flash");
    setTimeout(function () { el.creature.classList.remove("flash"); }, 220);
  }

  function toast(msg, ms) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.toast.classList.remove("show"); }, ms || 900);
  }

  function clearGates() {
    if (gateRowEl && gateRowEl.parentNode) gateRowEl.parentNode.removeChild(gateRowEl);
    gateRowEl = null;
  }

  function spawnGates(level) {
    clearGates();
    const row = document.createElement("div");
    row.className = "gate-row";
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", level.prompt || "選擇");
    level.options.forEach(function (opt, i) {
      const g = document.createElement("div");
      g.className = "gate" + (opt.tint === "bact" ? " hi" : opt.tint === "vir" ? " vir-hi" : "");
      g.dataset.idx = String(i);
      g.innerHTML = '<div class="g-title"></div><div class="g-sub"></div>';
      g.querySelector(".g-title").textContent = opt.title;
      g.querySelector(".g-sub").textContent = opt.sub || "";
      row.appendChild(g);
    });
    el.stage.appendChild(row);
    gateRowEl = row;
    const sh = el.stage.clientHeight;
    state.gateY = -100;
    state.gateTargetY = sh * 0.62;
    state.gateSpeed = 0; /* gates stay; creature falls into them */
    row.style.top = state.gateTargetY + "px";
    state.gateY = state.gateTargetY;
    state.gatesReady = true;
    state.resolved = false;
    /* place creature near top for this segment */
    state.y = Math.max(90, sh * 0.18);
    state.fallSpeed = Math.min(160, 110 + state.segment * 8);
  }

  function startGame() {
    cancelAnimationFrame(raf);
    clearGates();
    state = {
      nodeId: "seed",
      segment: 0,
      x: 0.5,
      y: 100,
      vx: 0,
      fallSpeed: 120,
      path: [{ label: "原始微粒", choice: "開局" }],
      gatesReady: false,
      resolved: false,
      pauseUntil: 0,
      domain: null /* 'bact' | 'vir' after first real fork */
    };
    showScreen("play");
    setForm("seed");
    const sw = el.stage.clientWidth;
    state.x = sw / 2;
    spawnGates(LEVELS.seed);
    lastTs = 0;
    raf = requestAnimationFrame(tick);
    toast(LEVELS.seed.prompt, 1200);
  }

  function pickOption(idx) {
    if (!state || state.resolved) return;
    const level = LEVELS[state.nodeId];
    if (!level || level.end || !level.options) return;
    const opt = level.options[idx];
    if (!opt) return;
    state.resolved = true;

    state.path.push({ label: FORMS[level.form].name, choice: opt.title });

    /* domain lock */
    if (opt.next === "bact_wall") state.domain = "bact";
    if (opt.next === "vir_capsid") state.domain = "vir";

    const nextId = opt.next;
    const nextNode = LEVELS[nextId];

    toast(opt.title, 700);
    clearGates();
    state.gatesReady = false;

    if (nextNode && nextNode.end) {
      const formId = nextNode.form;
      setForm(formId);
      state.path.push({ label: FORMS[formId].name, choice: "終局" });
      state.pauseUntil = performance.now() + 600;
      state.pendingEnd = nextNode;
      return;
    }

    /* morph then next segment */
    const formId = nextNode.form;
    state.nodeId = nextId;
    state.segment += 1;
    setForm(formId);
    state.pauseUntil = performance.now() + 500;
    state.pendingSpawn = nextId;
  }

  function finish(endNode) {
    cancelAnimationFrame(raf);
    clearGates();
    const form = FORMS[endNode.form];
    el.endMascot.innerHTML = form.draw();
    el.endTitle.textContent = endNode.endTitle;
    el.endLatin.textContent = form.latin;
    el.endStory.textContent = endNode.endStory + " " + PROOF.note;
    el.endPath.innerHTML = "";
    state.path.forEach(function (p) {
      const li = document.createElement("li");
      li.textContent = p.label + " ← " + p.choice;
      el.endPath.appendChild(li);
    });
    showScreen("end");
  }

  function nearestGateIndex() {
    if (!gateRowEl) return 0;
    const gates = gateRowEl.querySelectorAll(".gate");
    const cx = state.x;
    let best = 0, bestDist = Infinity;
    gates.forEach(function (g, i) {
      const r = g.getBoundingClientRect();
      const sr = el.stage.getBoundingClientRect();
      const mid = (r.left + r.right) / 2 - sr.left;
      const d = Math.abs(mid - cx);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  function highlightGate() {
    if (!gateRowEl) return;
    const idx = nearestGateIndex();
    gateRowEl.querySelectorAll(".gate").forEach(function (g, i) {
      g.style.outline = i === idx ? "2px solid #e6e2d6" : "none";
      g.style.outlineOffset = "2px";
    });
  }

  function tick(ts) {
    if (!state) return;
    if (!lastTs) lastTs = ts;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (ts < state.pauseUntil) {
      raf = requestAnimationFrame(tick);
      return;
    }
    if (state.pendingEnd) {
      const e = state.pendingEnd;
      state.pendingEnd = null;
      finish(e);
      return;
    }
    if (state.pendingSpawn) {
      const id = state.pendingSpawn;
      state.pendingSpawn = null;
      spawnGates(LEVELS[id]);
      toast(LEVELS[id].prompt, 1000);
    }

    const sw = el.stage.clientWidth;
    const sh = el.stage.clientHeight;
    const speed = 280;
    if (keys.left) state.vx = -speed;
    else if (keys.right) state.vx = speed;
    else state.vx *= 0.82;

    state.x += state.vx * dt;
    const margin = 36;
    if (state.x < margin) { state.x = margin; state.vx = 0; }
    if (state.x > sw - margin) { state.x = sw - margin; state.vx = 0; }

    if (state.gatesReady && !state.resolved) {
      state.y += state.fallSpeed * dt;
      highlightGate();
      /* collide with gate row */
      if (state.y >= state.gateY + 10) {
        pickOption(nearestGateIndex());
      }
      /* wrap if somehow missed */
      if (state.y > sh + 40 && !state.resolved) {
        pickOption(nearestGateIndex());
      }
    }

    el.creature.style.left = state.x + "px";
    el.creature.style.top = state.y + "px";

    raf = requestAnimationFrame(tick);
  }

  /* controls */
  document.getElementById("btnStart").addEventListener("click", startGame);
  document.getElementById("btnAgain").addEventListener("click", function () {
    showScreen("title");
  });

  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keys.left = true; e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keys.right = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  let touchX0 = null;
  el.stage.addEventListener("pointerdown", function (e) {
    if (!state || !el.play.classList.contains("active")) return;
    touchX0 = e.clientX;
    const rect = el.stage.getBoundingClientRect();
    const mid = rect.left + rect.width / 2;
    if (e.clientX < mid) keys.left = true;
    else keys.right = true;
    el.stage.setPointerCapture(e.pointerId);
  });
  el.stage.addEventListener("pointermove", function (e) {
    if (touchX0 == null || !state) return;
    const dx = e.clientX - touchX0;
    if (Math.abs(dx) > 8) {
      keys.left = dx < 0;
      keys.right = dx > 0;
    }
    /* direct steer toward pointer x within stage */
    const rect = el.stage.getBoundingClientRect();
    state.x = e.clientX - rect.left;
  });
  function clearPointer(e) {
    keys.left = false; keys.right = false; touchX0 = null;
    try { el.stage.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  el.stage.addEventListener("pointerup", clearPointer);
  el.stage.addEventListener("pointercancel", clearPointer);

  /* expose for evidence scripts */
  window.__VIRUS_FORK__ = {
    FORMS: FORMS,
    LEVELS: LEVELS,
    PROOF: PROOF,
    startGame: startGame,
    getState: function () { return state; },
    forcePick: function (idx) { pickOption(idx); },
    /** 將公仔移到第 idx 個門中央並立即落入 */
    fallInto: function (idx) {
      if (!state || !gateRowEl) return false;
      var gates = gateRowEl.querySelectorAll('.gate');
      var g = gates[idx];
      if (!g) return false;
      var r = g.getBoundingClientRect();
      var sr = el.stage.getBoundingClientRect();
      state.x = (r.left + r.right) / 2 - sr.left;
      state.y = state.gateY + 20;
      pickOption(idx);
      return true;
    }
  };
})();
</script>
</body>
</html>
