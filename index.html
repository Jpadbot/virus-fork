<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微粒進化</title>
<style>
  :root {
    --bg: #0b1218;
    --bg2: #121c24;
    --panel: #1a2630;
    --ink: #e8efe8;
    --muted: #8fa09a;
    --line: #2e3f48;
    --bact: #e0a83a;
    --bact-glow: rgba(224, 168, 58, 0.45);
    --vir: #5ec8e8;
    --vir-glow: rgba(94, 200, 232, 0.4);
    --gate: rgba(22, 34, 42, 0.92);
    --gate-hi: rgba(36, 52, 62, 0.96);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* 禁選字：全域＋互動區（必修） */
  html, body, #app, #app * {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    line-height: 1.4; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    width: 100%; max-width: 440px; height: 100%; height: 100dvh;
    margin: 0 auto; display: flex; flex-direction: column;
    position: relative; background: var(--bg);
  }
  .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .screen.active { display: flex; }

  #title {
    padding: 0 0 calc(20px + var(--safe-bottom));
    justify-content: flex-end; gap: 12px; text-align: center;
    position: relative; overflow: hidden;
    background: #05080c;
  }
  .cover-wrap {
    position: absolute; inset: 0; z-index: 0;
    background: #05080c;
  }
  .cover-wrap img {
    width: 100%; height: 100%; object-fit: cover; object-position: center top;
    display: block; pointer-events: none;
  }
  .cover-fade {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48%;
    background: linear-gradient(180deg, transparent 0%, rgba(5,8,12,0.55) 35%, rgba(5,8,12,0.96) 78%, #05080c 100%);
    pointer-events: none;
  }
  .title-body {
    position: relative; z-index: 1;
    padding: 0 20px 8px;
    display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  #title h1 {
    font-size: 1.65rem; font-weight: 700; margin: 0;
    letter-spacing: 0.12em; color: #f0d78a;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  #title .sub {
    margin: 0; color: #c8b88a; font-size: 0.88rem; letter-spacing: 0.04em;
  }
  #title .hint {
    margin: 0; color: var(--muted); font-size: 0.8rem; max-width: 300px;
  }
  .btn {
    display: block; width: 100%; max-width: 300px; margin: 0 auto;
    min-height: 48px; padding: 14px 16px;
    border: 1px solid #6a5a30; border-radius: 12px;
    background: linear-gradient(180deg, #3a3220 0%, #2a2418 100%);
    color: #f5e6b8;
    font-size: 1.08rem; font-weight: 700; font-family: inherit;
    cursor: pointer; letter-spacing: 0.06em;
    box-shadow: 0 0 20px rgba(224, 168, 58, 0.2);
  }
  .btn:active { filter: brightness(1.15); }
  .btn-ghost {
    background: transparent; border-color: var(--line); color: var(--muted);
    box-shadow: none; font-weight: 600; font-size: 0.95rem; min-height: 44px;
  }

  #play { position: relative; background: radial-gradient(ellipse at 50% 20%, #152028 0%, var(--bg) 55%); }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 12px 14px 10px;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(11,18,24,0.9) 0%, rgba(11,18,24,0) 100%);
  }
  #hud .name { font-size: 1.05rem; font-weight: 700; margin: 0; letter-spacing: 0.03em; }
  #hud .latin { font-size: 0.76rem; color: var(--muted); font-style: italic; margin: 2px 0 0; }
  #hud .blurb { font-size: 0.74rem; color: var(--muted); margin: 6px 0 0; max-width: 95%; }
  #stage {
    flex: 1; position: relative; overflow: hidden; touch-action: none;
    cursor: pointer;
  }
  .particles {
    position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .particles i {
    position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: rgba(140, 200, 210, 0.35);
    animation: drift linear infinite;
  }
  @keyframes drift {
    from { transform: translateY(-10px); opacity: 0; }
    10% { opacity: 0.6; }
    to { transform: translateY(110vh); opacity: 0; }
  }
  .lane-hint {
    position: absolute; inset: 0; display: flex; pointer-events: none; opacity: 0.07; z-index: 1;
  }
  .lane-hint span { flex: 1; border-right: 1px dashed #fff; }
  .lane-hint span:last-child { border-right: none; }

  #creature {
    position: absolute; width: 86px; height: 86px;
    margin-left: -43px; margin-top: -43px;
    z-index: 3; will-change: left, top;
    filter: drop-shadow(0 0 10px rgba(160, 210, 220, 0.35));
    transition: filter 0.2s;
  }
  #creature.flash { filter: drop-shadow(0 0 18px rgba(255, 230, 160, 0.85)) brightness(1.25); }

  .gate-row {
    position: absolute; left: 0; right: 0; height: 100px;
    display: flex; gap: 8px; padding: 0 10px;
    z-index: 2; will-change: top;
  }
  .gate-row.gates-3 { gap: 6px; padding: 0 8px; }
  .gate-row.gates-4 { gap: 4px; padding: 0 6px; }
  .gate {
    flex: 1; min-width: 0; min-height: 88px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--gate);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px 6px; text-align: center;
    box-shadow: inset 0 0 24px rgba(0,0,0,0.35);
    position: relative;
  }
  .gate-row.gates-4 .gate { min-height: 82px; padding: 6px 3px; border-radius: 10px; }
  .gate::before {
    content: ""; position: absolute; inset: 4px; border-radius: 8px;
    border: 1px dashed rgba(255,255,255,0.08); pointer-events: none;
  }
  .gate.hi {
    border-color: var(--bact);
    background: var(--gate-hi);
    box-shadow: 0 0 16px var(--bact-glow), inset 0 0 20px rgba(224,168,58,0.08);
  }
  .gate.vir-hi {
    border-color: var(--vir);
    background: var(--gate-hi);
    box-shadow: 0 0 16px var(--vir-glow), inset 0 0 20px rgba(94,200,232,0.08);
  }
  .gate .g-icon { width: 28px; height: 28px; margin-bottom: 4px; opacity: 0.9; flex-shrink: 0; }
  .gate-row.gates-4 .g-icon { width: 22px; height: 22px; margin-bottom: 2px; }
  .gate .g-title { font-size: 0.84rem; font-weight: 700; line-height: 1.15; word-break: break-word; }
  .gate-row.gates-3 .g-title { font-size: 0.76rem; }
  .gate-row.gates-4 .g-title { font-size: 0.68rem; }
  .gate .g-sub { font-size: 0.68rem; color: var(--muted); margin-top: 3px; line-height: 1.1; word-break: break-word; }
  .gate-row.gates-3 .g-sub { font-size: 0.62rem; }
  .gate-row.gates-4 .g-sub { font-size: 0.58rem; }

  #toast {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    z-index: 6; pointer-events: none;
    background: rgba(20, 30, 38, 0.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 16px;
    font-size: 0.92rem; text-align: center; max-width: 86%;
    opacity: 0; transition: opacity 0.2s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #toast.show { opacity: 1; }

  #controls-hint {
    position: absolute; bottom: calc(10px + var(--safe-bottom)); left: 0; right: 0;
    text-align: center; color: var(--muted); font-size: 0.74rem;
    z-index: 4; pointer-events: none;
  }

  #end {
    padding: 24px 18px calc(24px + var(--safe-bottom));
    justify-content: center; gap: 12px; text-align: center; overflow-y: auto;
    background: radial-gradient(ellipse at 50% 18%, #1a2830 0%, var(--bg) 55%);
  }
  #end h2 {
    margin: 0; font-size: 1.4rem; line-height: 1.35;
    color: #f0d78a; letter-spacing: 0.02em;
  }
  #end .latin { color: var(--muted); font-style: italic; font-size: 0.9rem; margin: 0; }
  #end .end-mascot {
    width: 160px; height: 160px; margin: 4px auto;
    filter: drop-shadow(0 0 18px rgba(160, 210, 220, 0.4));
  }
  #end .story { color: var(--muted); font-size: 0.88rem; margin: 0; text-align: left; }
  #end .path {
    font-size: 0.8rem; color: var(--muted); text-align: left;
    border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px;
  }
  #end .path ol { margin: 6px 0 0; padding-left: 1.2em; }
  .disclaimer {
    font-size: 0.72rem; color: #6a7a74; margin: 0; text-align: left;
  }

  /* —— 演化圖鑑（非對局 HUD） —— */
  .btn-secondary {
    background: linear-gradient(180deg, #243038 0%, #1a242c 100%);
    border-color: #3a4a54; color: #c8d8e0;
    box-shadow: none; font-weight: 650; font-size: 0.98rem;
  }
  #atlas {
    padding: 0; background: #0a1016;
    overflow: hidden;
  }
  .atlas-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px calc(6px);
    background: rgba(10,16,22,0.96);
    border-bottom: 1px solid var(--line);
  }
  .atlas-bar h2 {
    margin: 0; flex: 1; font-size: 1.05rem; letter-spacing: 0.06em; color: #f0d78a;
  }
  .atlas-bar .btn-mini {
    min-height: 40px; min-width: 64px; max-width: none; width: auto;
    margin: 0; padding: 8px 12px; font-size: 0.88rem;
    border-radius: 10px;
  }
  .atlas-rule {
    flex-shrink: 0;
    margin: 0; padding: 8px 12px 4px;
    font-size: 0.72rem; color: #8fa09a; line-height: 1.35; text-align: left;
  }
  .atlas-tabs {
    flex-shrink: 0;
    display: flex; gap: 6px; padding: 6px 12px 8px;
  }
  .atlas-tabs button {
    flex: 1; min-height: 40px; padding: 8px 6px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--muted);
    font-family: inherit; font-size: 0.82rem; font-weight: 650;
    cursor: pointer;
  }
  .atlas-tabs button.active {
    border-color: #6a5a30; color: #f5e6b8;
    background: linear-gradient(180deg, #3a3220 0%, #2a2418 100%);
  }
  .atlas-zoom {
    flex-shrink: 0;
    display: flex; gap: 6px; padding: 0 12px 8px; align-items: center;
  }
  .atlas-zoom button {
    min-height: 36px; min-width: 40px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg2); color: var(--ink);
    font-family: inherit; font-size: 0.9rem; cursor: pointer;
  }
  .atlas-zoom .zoom-label {
    margin-left: auto; font-size: 0.72rem; color: var(--muted);
  }
  .atlas-viewport {
    flex: 1; min-height: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
    padding: 0 8px 8px;
    overscroll-behavior: contain;
  }
  .atlas-canvas {
    transform-origin: 0 0;
    width: max-content; min-width: 100%;
    margin: 0 auto;
  }
  .atlas-canvas object, .atlas-canvas img {
    display: block; width: min(100vw, 440px); max-width: none;
    height: auto; background: #0f1419; border-radius: 8px;
    pointer-events: auto;
  }
  .atlas-leaves {
    flex-shrink: 0;
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 4px 12px 8px;
    max-height: 88px; overflow-y: auto;
  }
  .atlas-leaves button {
    min-height: 34px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 999px;
    background: #152028; color: #c8d8e0;
    font-family: inherit; font-size: 0.72rem; cursor: pointer;
  }
  .atlas-leaves button.active {
    border-color: #e0a83a; color: #f5e6b8; background: #2a2418;
  }
  .atlas-detail {
    flex-shrink: 0;
    margin: 0 12px calc(12px + var(--safe-bottom));
    padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel);
    font-size: 0.8rem; color: var(--ink); text-align: left; line-height: 1.4;
    display: none;
  }
  .atlas-detail.show { display: block; }
  .atlas-detail strong { color: #f0d78a; }
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen active" aria-label="開局">
    <div class="cover-wrap" aria-hidden="true">
      <img src="cover-v1.jpg" alt="" width="440" height="780" />
      <div class="cover-fade"></div>
    </div>
    <div class="title-body">
      <h1>微粒進化</h1>
      <p class="sub">Proto → Real Species</p>
      <p class="hint">多門選擇・成為誰　｜　簡化科普／假設・≥20 終局</p>
      <button type="button" class="btn" id="btnStart">開始下落</button>
      <button type="button" class="btn btn-secondary" id="btnAtlas">演化圖鑑</button>
    </div>
  </section>

  <section id="play" class="screen" aria-label="遊戲">
    <div id="hud">
      <p class="name" id="hudName">原始微粒</p>
      <p class="latin" id="hudLatin">Proto-microbe（簡化／假設）</p>
      <p class="blurb" id="hudBlurb">簡化科普／假設：尚未分化成細菌或病毒。</p>
    </div>
    <div id="stage">
      <div class="particles" id="particles" aria-hidden="true"></div>
      <div class="lane-hint" id="laneHint" aria-hidden="true"><span></span><span></span></div>
      <div id="creature" aria-hidden="true"></div>
      <div id="toast" role="status"></div>
      <div id="controls-hint">點／拖到門槽　鍵盤 ← →　支援 2–4 門</div>
    </div>
  </section>

  <section id="end" class="screen" aria-label="終局">
    <div class="end-mascot" id="endMascot"></div>
    <h2 id="endTitle">你已成為……</h2>
    <p class="latin" id="endLatin"></p>
    <p class="story" id="endStory"></p>
    <p class="disclaimer">簡化科普／假設・休閒探索；非醫療建議或診斷依據。</p>
    <div class="path">
      <strong>本局路徑</strong>
      <ol id="endPath"></ol>
    </div>
    <button type="button" class="btn" id="btnAgain">再玩一次</button>
    <button type="button" class="btn btn-secondary" id="btnAtlasEnd">演化圖鑑</button>
  </section>

  <section id="atlas" class="screen" aria-label="演化圖鑑">
    <div class="atlas-bar">
      <button type="button" class="btn btn-ghost btn-mini" id="btnAtlasBack">返回</button>
      <h2>演化圖鑑</h2>
    </div>
    <p class="atlas-rule">簡化科普／假設：根＝LUCA；細菌域／古菌域二分；真核＝古菌系衍生＋內共生（非第三域）；病毒＝多起源側枝。</p>
    <div class="atlas-tabs" role="tablist" aria-label="圖鑑版本">
      <button type="button" role="tab" data-ver="v1" class="active" id="tabV1">v1 概覽</button>
      <button type="button" role="tab" data-ver="v2" id="tabV2">v2 內共生</button>
      <button type="button" role="tab" data-ver="v3" id="tabV3">v3 深入</button>
    </div>
    <div class="atlas-zoom">
      <button type="button" id="btnZoomOut" aria-label="縮小">−</button>
      <button type="button" id="btnZoomIn" aria-label="放大">＋</button>
      <button type="button" id="btnZoomReset" aria-label="重置縮放">重置</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
    </div>
    <div class="atlas-viewport" id="atlasViewport">
      <div class="atlas-canvas" id="atlasCanvas">
        <img id="atlasObject" src="assets/evolution-trees/v1-overview.svg" alt="演化樹概覽（簡化科普／假設）" width="960" height="640" decoding="async" />
      </div>
    </div>
    <div class="atlas-leaves" id="atlasLeaves" aria-label="葉片說明"></div>
    <div class="atlas-detail" id="atlasDetail" role="status"></div>
  </section>
</div>

<script>
(function () {
  "use strict";

  function svg(inner, vb) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + (vb || "0 0 64 64") +
      '" width="100%" height="100%" aria-hidden="true">' + inner + "</svg>";
  }

  function cocci(fill, stroke, n) {
    var c = "";
    var pts = [[22,24],[40,22],[28,38],[46,38],[18,40]];
    for (var i = 0; i < (n || 4); i++) {
      var p = pts[i];
      c += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(10+(i%2))+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
    }
    c += '<circle cx="32" cy="28" r="2.5" fill="#fff8d0" opacity="0.5"/>';
    return svg(c);
  }
  function rod(fill, stroke, flagella) {
    var f = "";
    if (flagella) {
      f = '<line x1="56" y1="26" x2="62" y2="16" stroke="'+stroke+'" stroke-width="2"/>' +
          '<line x1="56" y1="32" x2="63" y2="32" stroke="'+stroke+'" stroke-width="2"/>' +
          '<line x1="56" y1="38" x2="62" y2="48" stroke="'+stroke+'" stroke-width="2"/>';
    }
    return svg(
      '<rect x="8" y="22" width="48" height="20" rx="10" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>' +
      '<ellipse cx="22" cy="32" rx="7" ry="6" fill="#6a4810" opacity="0.35"/>' +
      '<ellipse cx="42" cy="32" rx="7" ry="6" fill="#6a4810" opacity="0.35"/>' + f +
      '<circle cx="16" cy="28" r="2" fill="#fff8d0" opacity="0.45"/>'
    );
  }
  function spiral(fill, stroke) {
    return svg(
      '<path d="M12 40 Q20 12 32 32 Q44 52 52 24" fill="none" stroke="'+stroke+'" stroke-width="8" stroke-linecap="round"/>' +
      '<path d="M12 40 Q20 12 32 32 Q44 52 52 24" fill="none" stroke="'+fill+'" stroke-width="5" stroke-linecap="round"/>' +
      '<circle cx="14" cy="38" r="3" fill="#fff0c0" opacity="0.4"/>'
    );
  }
  function sporeRod(fill, stroke) {
    return svg(
      '<rect x="14" y="24" width="36" height="16" rx="8" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>' +
      '<ellipse cx="20" cy="32" rx="7" ry="6" fill="#5a4010" opacity="0.5"/>' +
      '<circle cx="20" cy="32" r="4" fill="#3a2808" opacity="0.6"/>' +
      '<circle cx="44" cy="30" r="2" fill="#fff0c0" opacity="0.4"/>'
    );
  }
  function virion(fill, stroke, spikes) {
    var s = "";
    if (spikes) {
      var pts = [[32,8],[12,18],[52,18],[8,40],[56,40]];
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        s += '<line x1="32" y1="34" x2="'+p[0]+'" y2="'+p[1]+'" stroke="'+stroke+'" stroke-width="2"/>';
        s += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="#e8f4ff"/>';
      }
    }
    return svg(
      '<ellipse cx="32" cy="34" rx="15" ry="12" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>' +
      '<ellipse cx="32" cy="34" rx="7" ry="5" fill="#1a3040"/>' + s
    );
  }
  function naked(fill, stroke) {
    return svg(
      '<circle cx="32" cy="32" r="17" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>' +
      '<circle cx="32" cy="32" r="10" fill="none" stroke="'+stroke+'" stroke-width="1.5" opacity="0.6"/>' +
      '<circle cx="32" cy="32" r="5" fill="#104058"/>' +
      '<circle cx="24" cy="26" r="2.5" fill="#e0f8ff" opacity="0.45"/>'
    );
  }
  function hexVir(fill, stroke) {
    return svg(
      '<polygon points="32,8 52,20 52,44 32,56 12,44 12,20" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/>' +
      '<polygon points="32,18 42,24 42,40 32,46 22,40 22,24" fill="#1a3040" opacity="0.55"/>' +
      '<circle cx="32" cy="32" r="4" fill="#b8e0f0" opacity="0.5"/>'
    );
  }

  const FORMS = {
    seed: {
      id: "seed", name: "原始微粒", latin: "Proto-microbe（簡化／假設）",
      blurb: "簡化科普／假設：共同起點，尚未分化成細菌或病毒。",
      draw: function () {
        return svg(

    return svg('<circle cx="32" cy="32" r="12" fill="#6a7870" stroke="#a8b0a8" stroke-width="2"/>', "0 0 64 64");

  function buildProof() {
    var endings = [];
    var routes = {};
    Object.keys(LEVELS).forEach(function (id) {
      if (LEVELS[id].end) endings.push(id);
    });
    function walk(nodeId, path) {
      var n = LEVELS[nodeId];
      if (!n) return;
      if (n.end) {
        routes[nodeId] = path.slice();
        return;
      }
      (n.options || []).forEach(function (opt) {
        walk(opt.next, path.concat([nodeId + "→" + opt.next]));
      });
    }
    walk("seed", []);
    return {
      endings: endings,
      endingCount: endings.length,
      note: "第一關三分：細菌壁／彎曲體／病毒殼。細菌線：球菌三終局、桿菌→腸道二終局＋結核、芽孢三終局、彎曲二終局。病毒線：有膜 RNA 四終局、裸殼三終局、DNA 二終局、反轉錄→HIV。所有選項 next 互異，無假分叉。簡化科普／假設。",
      routes: routes
    };
  }

  function clearGates() {
    if (gateRowEl && gateRowEl.parentNode) gateRowEl.parentNode.removeChild(gateRowEl);

  function setLaneCount(n) {
    el.laneHint.innerHTML = "";

    }
  }

  function spawnGates(level) {
    clearGates();
    var n = level.options.length;
    setLaneCount(n);
    var row = document.createElement("div");
    row.className = "gate-row gates-" + n;
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", level.prompt || "選擇");
    level.options.forEach(function (opt, i) {
      var g = document.createElement("div");
      g.className = "gate" + (opt.tint === "bact" ? " hi" : opt.tint === "vir" ? " vir-hi" : "");
      g.dataset.idx = String(i);
      g.innerHTML = '<div class="g-icon"></div><div class="g-title"></div><div class="g-sub"></div>';

      g.querySelector(".g-sub").textContent = opt.sub || "";
      row.appendChild(g);
    });
    el.stage.appendChild(row);
    gateRowEl = row;
    var sh = el.stage.clientHeight;
    state.gateTargetY = sh * 0.60;
    row.style.top = state.gateTargetY + "px";
    state.gateY = state.gateTargetY;
    state.gatesReady = true;
    state.resolved = false;
    state.y = Math.max(90, sh * 0.16);
    state.fallSpeed = Math.min(170, 115 + state.segment * 10);
  }

  function startGame() {
    cancelAnimationFrame(raf);
    clearGates();
    state = {
      nodeId: "seed",
      segment: 0,
      x: 0.5,
      y: 100,
      vx: 0,
      fallSpeed: 120,
      path: [{ label: "原始微粒", choice: "開局" }],
      gatesReady: false,
      resolved: false,
      pauseUntil: 0,
      domain: null

    showScreen("play");
    setForm("seed");
    state.x = el.stage.clientWidth / 2;
    spawnGates(LEVELS.seed);
    lastTs = 0;
    raf = requestAnimationFrame(tick);
    toast(LEVELS.seed.prompt, 1200);

  function pickOption(idx) {
    if (!state || state.resolved) return;
    var level = LEVELS[state.nodeId];
    if (!level || level.end || !level.options) return;
    var opt = level.options[idx];
    if (!opt) return;
    state.resolved = true;
    state.path.push({ label: FORMS[level.form].name, choice: opt.title });

    if (opt.next === "bact_wall" || opt.next === "curve_wall") state.domain = "bact";
    if (opt.next === "vir_capsid") state.domain = "vir";

    var nextId = opt.next;
    var nextNode = LEVELS[nextId];

    toast(opt.title, 700);
    clearGates();
    state.gatesReady = false;

    if (nextNode && nextNode.end) {
      var formId = nextNode.form;
      setForm(formId);
      state.path.push({ label: FORMS[formId].name, choice: "終局" });
      state.pauseUntil = performance.now() + 600;
      state.pendingEnd = nextNode;
      return;
    }

    state.nodeId = nextId;
    state.segment += 1;
    setForm(nextNode.form);
    state.pauseUntil = performance.now() + 500;
    state.pendingSpawn = nextId;
  }

  function finish(endNode) {
    cancelAnimationFrame(raf);
    clearGates();
    var form = FORMS[endNode.form];
    el.endMascot.innerHTML = form.draw();
    el.endTitle.textContent = endNode.endTitle;
    el.endLatin.textContent = form.latin;
    el.endStory.textContent = endNode.endStory + " " + PROOF.note;
    el.endPath.innerHTML = "";
    state.path.forEach(function (p) {
      var li = document.createElement("li");
      li.textContent = p.label + " ← " + p.choice;
      el.endPath.appendChild(li);
    });
    showScreen("end");
  }

  function nearestGateIndex() {
    if (!gateRowEl) return 0;
    var gates = gateRowEl.querySelectorAll(".gate");
    var cx = state.x;
    var best = 0, bestDist = Infinity;
    gates.forEach(function (g, i) {
      var r = g.getBoundingClientRect();
      var sr = el.stage.getBoundingClientRect();
      var mid = (r.left + r.right) / 2 - sr.left;
      var d = Math.abs(mid - cx);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  /** 依水平位置均分寬度對應門槽（N>2） */
  function gateIndexFromClientX(clientX) {
    if (!gateRowEl || !state) return 0;
    var gates = gateRowEl.querySelectorAll(".gate");
    var n = gates.length;
    if (n <= 0) return 0;
    var rect = el.stage.getBoundingClientRect();
    var x = clientX - rect.left;
    var ratio = Math.max(0, Math.min(0.999, x / Math.max(1, rect.width)));
    return Math.min(n - 1, Math.floor(ratio * n));
  }

  function highlightGate() {
    if (!gateRowEl) return;
    var idx = nearestGateIndex();
    gateRowEl.querySelectorAll(".gate").forEach(function (g, i) {
      g.style.outline = i === idx ? "2px solid #e8efe8" : "none";
      g.style.outlineOffset = "2px";
    });
  }

  function tick(ts) {
    if (!state) return;
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;

    if (ts < state.pauseUntil) {
      raf = requestAnimationFrame(tick);
      return;
    }
    if (state.pendingEnd) {
      var e = state.pendingEnd;
      state.pendingEnd = null;
      finish(e);
      return;
    }
    if (state.pendingSpawn) {
      var id = state.pendingSpawn;
      state.pendingSpawn = null;
      spawnGates(LEVELS[id]);
      toast(LEVELS[id].prompt, 1000);
    }

    var sw = el.stage.clientWidth;
    var sh = el.stage.clientHeight;
    var speed = 300;
    if (keys.left) state.vx = -speed;
    else if (keys.right) state.vx = speed;
    else state.vx *= 0.82;

    state.x += state.vx * dt;
    var margin = 28;
    if (state.x < margin) { state.x = margin; state.vx = 0; }
    if (state.x > sw - margin) { state.x = sw - margin; state.vx = 0; }

    if (state.gatesReady && !state.resolved) {
      state.y += state.fallSpeed * dt;
      highlightGate();
      if (state.y >= state.gateY + 10) {
        pickOption(nearestGateIndex());
      }
      if (state.y > sh + 40 && !state.resolved) {
        pickOption(nearestGateIndex());
      }
    }

    el.creature.style.left = state.x + "px";
    el.creature.style.top = state.y + "px";

    raf = requestAnimationFrame(tick);
  }

      b.type = "button";

      el.atlasLeaves.appendChild(b);
    });
  }

  function showLeafDetail(leafId) {
    var pack = ATLAS[atlasState.ver];
    var leaf = null;
    for (var i = 0; i < pack.leaves.length; i++) {
      if (pack.leaves[i].id === leafId) { leaf = pack.leaves[i]; break; }
    }
    if (!leaf) {
      el.atlasDetail.classList.remove("show");
      el.atlasDetail.textContent = "";
      atlasState.leafId = null;
      renderAtlasLeaves();
      return;
    }
    atlasState.leafId = leafId;
    el.atlasDetail.innerHTML = "<strong>" + leaf.title + "</strong> — " + leaf.body;
    el.atlasDetail.classList.add("show");
    renderAtlasLeaves();

  function loadAtlasVersion(ver) {
    if (!ATLAS[ver]) return;
    atlasState.ver = ver;

    document.querySelectorAll(".atlas-tabs button").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-ver") === ver);
    });
    var pack = ATLAS[ver];
    var obj = el.atlasObject;
    /* 相對路徑優先 SVG；onerror 後備 PNG */

      if (obj.dataset.fallbackApplied === pack.fallback) return;
      obj.dataset.fallbackApplied = pack.fallback;
      obj.src = pack.fallback;
    };
    obj.dataset.fallbackApplied = "";
    obj.src = pack.src;
    obj.alt = pack.label + "（簡化科普／假設）";
    /* 依版本調整 intrinsic 提示寬高比 */
    if (ver === "v1") { obj.width = 960; obj.height = 640; }
    else if (ver === "v2") { obj.width = 1100; obj.height = 720; }
    else { obj.width = 1280; obj.height = 860; }
    el.atlasDetail.classList.remove("show");
    el.atlasDetail.textContent = "";
    renderAtlasLeaves();
    setAtlasZoom(1);
    el.atlasViewport.scrollLeft = 0;
    el.atlasViewport.scrollTop = 0;
  }

  function openAtlas(from) {
    atlasState.returnTo = from || "title";
    showScreen("atlas");
    loadAtlasVersion(atlasState.ver || "v1");
  }

  function closeAtlas() {
    showScreen(atlasState.returnTo === "end" ? "end" : "title");
  }


  document.getElementById("btnStart").addEventListener("click", startGame);
  document.getElementById("btnAgain").addEventListener("click", function () {
    showScreen("title");
  });
  document.getElementById("btnAtlas").addEventListener("click", function () { openAtlas("title"); });
  document.getElementById("btnAtlasEnd").addEventListener("click", function () { openAtlas("end"); });
  document.getElementById("btnAtlasBack").addEventListener("click", closeAtlas);
  document.querySelectorAll(".atlas-tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () { loadAtlasVersion(btn.getAttribute("data-ver")); });
  });
  document.getElementById("btnZoomIn").addEventListener("click", function () { setAtlasZoom(atlasState.zoom + 0.2); });
  document.getElementById("btnZoomOut").addEventListener("click", function () { setAtlasZoom(atlasState.zoom - 0.2); });
  document.getElementById("btnZoomReset").addEventListener("click", function () { setAtlasZoom(1); });


  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keys.left = true; e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keys.right = true; e.preventDefault(); }
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
  });

  /* 觸控：preventDefault 擋長按選字；水平位置對應最近門／均分區（N>2） */
  var touchX0 = null;
  el.stage.addEventListener("touchstart", function (e) {
    if (!state || !el.play.classList.contains("active")) return;
    e.preventDefault();
  }, { passive: false });
  el.stage.addEventListener("touchmove", function (e) {
    if (!state || !el.play.classList.contains("active")) return;
    e.preventDefault();
  }, { passive: false });

  el.stage.addEventListener("pointerdown", function (e) {
    if (!state || !el.play.classList.contains("active")) return;
    if (e.pointerType === "touch") e.preventDefault();
    touchX0 = e.clientX;
    var rect = el.stage.getBoundingClientRect();
    state.x = e.clientX - rect.left;
    /* 不再寫死左右半＝2 選；以位置對齊門槽 */
    var gi = gateIndexFromClientX(e.clientX);
    if (gateRowEl) {
      var gates = gateRowEl.querySelectorAll(".gate");
      if (gates[gi]) {
        var gr = gates[gi].getBoundingClientRect();
        state.x = (gr.left + gr.right) / 2 - rect.left;
      }
    }
    try { el.stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  el.stage.addEventListener("pointermove", function (e) {
    if (touchX0 == null || !state) return;
    var rect = el.stage.getBoundingClientRect();
    state.x = e.clientX - rect.left;
    var dx = e.clientX - touchX0;
    if (Math.abs(dx) > 8) {
      keys.left = dx < 0;
      keys.right = dx > 0;
    }
  });
  function clearPointer(e) {
    keys.left = false; keys.right = false; touchX0 = null;
    try { el.stage.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  el.stage.addEventListener("pointerup", clearPointer);
  el.stage.addEventListener("pointercancel", clearPointer);

  el.stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.getElementById("app").addEventListener("contextmenu", function (e) {
    if (el.play.classList.contains("active")) e.preventDefault();
  });

  function assertNoFakeForks() {
    var bad = [];
    Object.keys(LEVELS).forEach(function (id) {
      var n = LEVELS[id];
      if (!n.options) return;
      var seen = {};
      n.options.forEach(function (opt, i) {
        if (seen[opt.next]) bad.push(id + " options[" + seen[opt.next] + "] and [" + i + "] share next=" + opt.next);
        seen[opt.next] = i;
      });
    });
    return bad;
  }

  window.__VIRUS_FORK__ = {
    FORMS: FORMS,
    LEVELS: LEVELS,
    PROOF: PROOF,
    ATLAS: ATLAS,
    openAtlas: openAtlas,
    loadAtlasVersion: loadAtlasVersion,
    startGame: startGame,
    getState: function () { return state; },
    forcePick: function (idx) { pickOption(idx); },
    assertNoFakeForks: assertNoFakeForks,
    gateIndexFromClientX: gateIndexFromClientX,
    fallInto: function (idx) {
      if (!state || !gateRowEl) return false;
      var gates = gateRowEl.querySelectorAll(".gate");
      var g = gates[idx];
      if (!g) return false;
      var r = g.getBoundingClientRect();
      var sr = el.stage.getBoundingClientRect();
      state.x = (r.left + r.right) / 2 - sr.left;
      state.y = state.gateY + 20;
      pickOption(idx);
      return true;
    }
  };
})();
</script>
</body>
</html>
